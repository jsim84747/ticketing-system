# Render Blueprint: a public web service plus a private Redis-compatible
# Key Value store. Create it from the Render dashboard: New → Blueprint.
services:
  - type: keyvalue
    name: ticketing-redis
    plan: free
    # Only services in this Render account can connect; nothing from outside.
    ipAllowList: []
    # The queue must never lose keys to eviction.
    maxmemoryPolicy: noeviction

  - type: web
    name: ticketing
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ticketing-redis
          property: connectionString
      # Render generates a random secret once; it stays the same across deploys.
      - key: TOKEN_SECRET
        generateValue: true
      # The admin password. Render asks for it when the Blueprint is created.
      - key: ADMIN_TOKEN
        sync: false
      - key: EVENT_IDS
        value: demo
      - key: EVENT_TICKETS
        value: "10000"
      - key: ACTIVE_LIMIT
        value: "1000"
