services:
  redis:
    image: redis:7.2.7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: "0.0.0.0:8080"
      REDIS_URL: "redis://redis:6379/0"
      TOKEN_SECRET: "${TOKEN_SECRET:?Set TOKEN_SECRET in .env to at least 32 random bytes}"
      ACTIVE_LIMIT: "${ACTIVE_LIMIT:-1000}"
      EVENT_IDS: "${EVENT_IDS:-demo}"
      EVENT_TICKETS: "${EVENT_TICKETS:-10000}"
      HEARTBEAT_TIMEOUT: "${HEARTBEAT_TIMEOUT:-30s}"
      MAX_STAY: "${MAX_STAY:-10m}"
      WORKER_INTERVAL: "${WORKER_INTERVAL:-1s}"
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis-data:
